<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav">
        <h2>Keydrop</h2>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Productos</a>
            <a href="#">Conctacto</a>
        </nav>
    </header>
<main class="productos">

    <div class="card">
        <span class="etiqueta">-10%</span>
        <img src="assets/caja.jpg" alt="caja">
        <h3>Caja 1</h3>
        <p>2.49$</p>
        <button>Comprar</button>
    </div>
    <div class="card">
        <span class="etiqueta">-15%</span>
        <img src="assets/agente.jpg" alt="agente">
        <h3>Agente</h3>
        <p>75$</p>
        <button>Comprar</button>
    </div>
    <div class="card">
        <span class="etiqueta">-35%</span>
        <img src="assets/cuchillo.jpg" alt="cuchillo">
        <h3>Cuchillo</h3>
        <p>799$</p>
        <button>Comprar</button>
    </div>
</main>
<button class="flot">🛒</button>
</body>
</html>
